<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>빅워시 AS - 온라인 접수</title>
  <style>
    :root {
      --bg: #0b1220; --card: #162033; --line: #243149; --text: #e7eefc;
      --muted: #8fa3c1; --accent: #3de0c7;
      --sans: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Noto Sans KR", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans); color: var(--text); min-height: 100vh;
      background: radial-gradient(900px 400px at 20% 0%, rgba(61,224,199,.12), transparent 55%), var(--bg);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .box {
      width: 100%; max-width: 460px; background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 28px 24px; box-shadow: 0 16px 40px rgba(0,0,0,.35);
    }
    h1 { font-size: 22px; margin-bottom: 6px; }
    .sub { color: var(--muted); font-family: var(--mono); font-size: 12px; margin-bottom: 20px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; letter-spacing: .04em; text-transform: uppercase; }
    input, textarea {
      width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line);
      background: #0e1626; color: var(--text); font-size: 14px;
    }
    textarea { min-height: 80px; resize: vertical; }
    button {
      width: 100%; margin-top: 18px; padding: 12px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #2bd4bd, #2a9df4); color: #041018; font-weight: 800; cursor: pointer;
    }
    .msg { margin-top: 12px; font-size: 13px; display: none; }
    .msg.show { display: block; }
    .ok { color: var(--accent); }
    .err { color: #ff8a95; }
    .links { margin-top: 18px; text-align: center; font-size: 12px; }
    .links a { color: var(--muted); margin: 0 8px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>AS 온라인 접수</h1>
    <p class="sub">bigwash customer intake</p>
    <form id="form">
      <label for="name">고객명 *</label>
      <input id="name" required placeholder="홍길동" />
      <label for="phone">연락처 *</label>
      <input id="phone" required type="tel" placeholder="010-1234-5678" />
      <label for="equipment">장비명</label>
      <input id="equipment" placeholder="세탁기 / 고압분사기" />
      <label for="symptom">증상 *</label>
      <textarea id="symptom" required placeholder="증상을 적어 주세요"></textarea>
      <label for="address">주소</label>
      <input id="address" placeholder="방문 주소" />
      <button type="submit">접수하기</button>
    </form>
    <div class="msg" id="msg"></div>
    <div class="links">
      <a href="/customer.html">내 AS 조회</a>
      <a href="/admin/login.html">관리자</a>
    </div>
  </div>
  <script>
    const msg = document.getElementById('msg');
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      const body = {
        customer_name: document.getElementById('name').value.trim(),
        customer_phone: document.getElementById('phone').value.trim(),
        equipment_name: document.getElementById('equipment').value.trim(),
        symptom: document.getElementById('symptom').value.trim(),
        address: document.getElementById('address').value.trim()
      };
      try {
        const res = await fetch('/as/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '접수 실패');
        msg.textContent = '접수 완료 · 접수번호 #' + (data.receipt_no || data.id.slice(0, 8));
        msg.className = 'msg show ok';
        e.target.reset();
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'msg show err';
      }
    });
  </script>
</body>
</html>
