<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>빅워시 AS - 관리자 로그인</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121a2b;
      --line: #243149;
      --text: #e7eefc;
      --muted: #8fa3c1;
      --accent: #3de0c7;
      --danger: #ff6b7a;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Noto Sans KR", sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      color: var(--text);
      background:
        radial-gradient(900px 420px at 15% 10%, rgba(61, 224, 199, 0.14), transparent 55%),
        radial-gradient(700px 360px at 90% 85%, rgba(91, 140, 255, 0.14), transparent 50%),
        var(--bg);
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      background: rgba(18, 26, 43, 0.92);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 36px 32px 28px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo .mark {
      width: 42px;
      height: 42px;
      margin: 0 auto 14px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(61, 224, 199, 0.12);
      border: 1px solid rgba(61, 224, 199, 0.35);
      color: var(--accent);
      font-weight: 800;
      font-family: var(--mono);
      font-size: 14px;
    }

    .logo h1 {
      font-size: 24px;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
    }

    .logo p {
      color: var(--muted);
      font-size: 13px;
      font-family: var(--mono);
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 14px;
      background: #0e1626;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder { color: #5f7394; }

    input:focus {
      outline: none;
      border-color: rgba(61, 224, 199, 0.55);
      box-shadow: 0 0 0 3px rgba(61, 224, 199, 0.12);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: linear-gradient(135deg, #2bd4bd, #2a9df4);
      color: #041018;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: filter 0.15s, transform 0.15s;
    }

    button:hover { filter: brightness(1.06); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .error {
      padding: 12px;
      background: rgba(255, 107, 122, 0.12);
      color: #ff8a95;
      border: 1px solid rgba(255, 107, 122, 0.35);
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 13px;
      display: none;
    }

    .error.show { display: block; }

    .loading {
      display: none;
      text-align: center;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      color: var(--muted);
      font-size: 11px;
      font-family: var(--mono);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <div class="mark">BW</div>
      <h1>빅워시 AS</h1>
      <p>admin console · auth gate</p>
    </div>

    <div class="error" id="errorMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="admin"
          required
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        />
      </div>

      <div class="loading" id="loading">authenticating…</div>
      <button type="submit" id="loginBtn">로그인</button>
    </form>

    <div class="footer">
      bigwash-as · afj + afl-db<br/>console theme v2
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loading = document.getElementById('loading');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      errorMsg.classList.remove('show');
      loading.style.display = 'block';
      loginBtn.disabled = true;

      try {
        const response = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('adminId', data.admin_id);
          window.location.href = '/admin/dashboard.html';
        } else {
          throw new Error(data.error || '로그인 실패');
        }
      } catch (error) {
        errorMsg.textContent = error.message;
        errorMsg.classList.add('show');
      } finally {
        loading.style.display = 'none';
        loginBtn.disabled = false;
      }
    });

    if (localStorage.getItem('token')) {
      window.location.href = '/admin/dashboard.html';
    }
  </script>
</body>
</html>
