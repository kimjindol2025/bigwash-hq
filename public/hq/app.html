<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>빅워시 HQ</title>
  <style>
    :root {
      --bg:#0b1220; --panel:#121a2b; --card:#162033; --line:#243149;
      --text:#e7eefc; --muted:#8fa3c1; --accent:#3de0c7; --danger:#ff6b7a;
      --warn:#ffb020; --info:#5b8cff; --ok:#3ddc97;
      --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      --sans:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Noto Sans KR",sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex}
    .sidebar{width:220px;background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
    .brand{padding:8px 10px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
    .brand h1{font-size:16px}
    .brand p{color:var(--muted);font-size:11px;font-family:var(--mono);margin-top:4px}
    .nav button{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--muted);padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px}
    .nav button:hover{color:var(--text);background:rgba(255,255,255,.03)}
    .nav button.active{color:var(--accent);border-color:rgba(61,224,199,.35);background:rgba(61,224,199,.08)}
    .userbox{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:12px}
    .userbox .muted{color:var(--muted)}
    .main{flex:1;display:flex;flex-direction:column;min-width:0}
    .top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:rgba(18,26,43,.9)}
    .content{padding:16px 18px 40px;overflow:auto}
    .panel{display:none}
    .panel.active{display:block}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
    .card h3{font-size:15px;margin-bottom:10px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
    .grow{flex:1;min-width:140px}
    label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;letter-spacing:.03em}
    input,select,textarea{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:#0e1626;color:var(--text);font-size:13px}
    textarea{min-height:70px;resize:vertical}
    .btn{border:1px solid var(--line);background:transparent;color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px}
    .btn:hover{border-color:#3a4b6a}
    .btn-primary{background:linear-gradient(135deg,#2bd4bd,#2a9df4);color:#041018;border:none;font-weight:700}
    .btn-danger{border-color:rgba(255,107,122,.5);color:var(--danger)}
    .btn-sm{padding:5px 9px;font-size:12px}
    .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:12px}
    .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
    .stat .v{font-family:var(--mono);font-size:22px;font-weight:700}
    .stat .l{font-size:11px;color:var(--muted);margin-top:4px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
    th{color:var(--muted);font-weight:600;font-size:11px}
    tr.clickable{cursor:pointer}
    tr.clickable:hover{background:rgba(255,255,255,.03)}
    .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line)}
    .mono{font-family:var(--mono)}
    .muted{color:var(--muted)}
    .empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
    .toast{position:fixed;right:16px;bottom:16px;background:var(--card);border:1px solid rgba(61,224,199,.4);padding:10px 14px;border-radius:10px;display:none;z-index:50;max-width:360px}
    .toast.show{display:block}
    .toast.err{border-color:rgba(255,107,122,.5);color:#ff8a95}
    .drawer-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30}
    .drawer-bg.show{display:block}
    .drawer{position:fixed;top:0;right:0;width:min(520px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);z-index:40;transform:translateX(100%);transition:.2s;overflow:auto;padding:16px}
    .drawer.show{transform:translateX(0)}
    .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45;align-items:center;justify-content:center}
    .modal-bg.show{display:flex}
    .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(480px,92%);max-height:90vh;overflow:auto}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .split{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}
    @media(max-width:980px){.split{grid-template-columns:1fr}.sidebar{width:180px}}
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><h1>빅워시 HQ</h1><p>본사 운영</p></div>
    <nav class="nav" id="nav"></nav>
    <div class="userbox">
      <div id="uName">—</div>
      <div class="muted" id="uRole">—</div>
      <div class="actions"><button class="btn btn-sm" type="button" id="btnLogout">로그아웃</button></div>
    </div>
  </aside>
  <div class="main">
    <div class="top">
      <div>
        <strong id="title">대시보드</strong>
        <div class="muted mono" id="meta" style="font-size:11px"></div>
      </div>
      <button class="btn btn-sm" type="button" id="btnRefresh">새로고침</button>
    </div>
    <div class="content">
      <section class="panel active" id="p-dashboard"><div class="stats" id="dash"></div><div class="card" id="dashExtra"></div></section>
      <section class="panel" id="p-desk"></section>
      <section class="panel" id="p-board"></section>
      <section class="panel" id="p-schedule"></section>
      <section class="panel" id="p-customers"></section>
      <section class="panel" id="p-equipment"></section>
      <section class="panel" id="p-users"></section>
      <section class="panel" id="p-mall"></section>
      <section class="panel" id="p-regions"></section>
      <section class="panel" id="p-settle"></section>
      <section class="panel" id="p-reports"></section>
      <section class="panel" id="p-followup"></section>
      <section class="panel" id="p-settings"></section>
    </div>
  </div>
  <div class="drawer-bg" id="drawerBg"></div>
  <aside class="drawer" id="drawer"><div id="drawerBody"></div></aside>
  <div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>
  <div class="toast" id="toast"></div>

<script>
(function () {
  const MENUS = [
    ['dashboard','대시보드'],['desk','전화 데스크'],['board','출장/티켓'],['schedule','스케줄'],
    ['customers','고객'],['equipment','장비'],['users','직원'],['mall','사내몰'],
    ['regions','권역·출장비'],['settle','정산'],['reports','보고'],['followup','사후함'],['settings','설정']
  ];
  const STATUS = {
    received:'접수', waiting_assign:'배정대기', assigned:'배정됨', en_route:'출장중',
    repairing:'수리중', parts_wait:'부품대기', done:'완료', followup:'사후확인',
    closed:'종결', hold:'보류', cancelled:'취소', reopen:'재오픈'
  };
  const NEXT = {
    received:['waiting_assign','assigned','cancelled'],
    waiting_assign:['assigned','cancelled'],
    assigned:['en_route','hold','cancelled'],
    en_route:['repairing','parts_wait','done'],
    repairing:['parts_wait','done'],
    parts_wait:['repairing','done'],
    done:['followup'],
    followup:['closed','reopen'],
    closed:['reopen'],
    reopen:['waiting_assign','assigned'],
    hold:['assigned','waiting_assign','cancelled'],
    cancelled:[]
  };

  let token = localStorage.getItem('hq_token') || '';
  let user = {};
  try { user = JSON.parse(localStorage.getItem('hq_user') || '{}'); } catch (_) {}
  let panel = 'dashboard';
  let selectedCustomer = null;
  let staff = [];
  let regions = [];
  let currentTicket = null;

  if (!token) location.href = '/hq/login.html';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function toast(msg, err) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (err ? ' err' : '');
    setTimeout(() => el.classList.remove('show'), 3200);
  }
  async function api(path, opt) {
    opt = opt || {};
    const headers = Object.assign({ 'Authorization': 'Bearer ' + token }, opt.headers || {});
    if (opt.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
    const res = await fetch(path, Object.assign({}, opt, { headers }));
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (_) { data = { raw: text }; }
    if (res.status === 401) {
      localStorage.clear();
      location.href = '/hq/login.html';
      throw new Error('로그인 만료');
    }
    if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
    return data;
  }
  function showModal(html) {
    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('modalBg').classList.add('show');
  }
  function closeModal() { document.getElementById('modalBg').classList.remove('show'); }
  function openDrawer(html) {
    document.getElementById('drawerBody').innerHTML = html;
    document.getElementById('drawer').classList.add('show');
    document.getElementById('drawerBg').classList.add('show');
  }
  function closeDrawer() {
    document.getElementById('drawer').classList.remove('show');
    document.getElementById('drawerBg').classList.remove('show');
  }
  function badge(st) {
    return '<span class="badge">' + esc(STATUS[st] || st || '-') + '</span>';
  }

  // nav
  const nav = document.getElementById('nav');
  nav.innerHTML = MENUS.map(([id, label]) =>
    '<button type="button" data-panel="' + id + '">' + label + '</button>'
  ).join('');
  nav.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-panel]');
    if (b) showPanel(b.dataset.panel);
  });
  document.getElementById('btnLogout').onclick = () => { localStorage.clear(); location.href = '/hq/login.html'; };
  document.getElementById('btnRefresh').onclick = () => refresh();
  document.getElementById('drawerBg').onclick = closeDrawer;
  document.getElementById('modalBg').onclick = (e) => { if (e.target.id === 'modalBg') closeModal(); };
  document.getElementById('uName').textContent = user.name || user.login || 'user';
  document.getElementById('uRole').textContent = user.role || '';

  function showPanel(name) {
    panel = name;
    document.querySelectorAll('.panel').forEach((p) => p.classList.remove('active'));
    document.getElementById('p-' + name).classList.add('active');
    nav.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.panel === name));
    document.getElementById('title').textContent = (MENUS.find((m) => m[0] === name) || [, name])[1];
    document.getElementById('meta').textContent = new Date().toLocaleString('ko-KR');
    refresh();
  }

  async function loadStaff() {
    staff = await api('/hq/users?assignable=1');
    return staff;
  }
  async function loadRegions() {
    regions = await api('/hq/regions');
    return regions;
  }
  function staffOptions(selected) {
    return '<option value="">미배정</option>' + staff.map((u) =>
      '<option value="' + esc(u.user_id) + '"' + (selected === u.user_id ? ' selected' : '') + '>' +
      esc(u.name) + ' (' + esc(u.role) + ')</option>'
    ).join('');
  }
  function regionOptions(selected) {
    return '<option value="">권역 선택</option>' + regions.map((r) =>
      '<option value="' + esc(r.region_id) + '"' + (selected === r.region_id ? ' selected' : '') + '>' +
      esc(r.name) + ' · ' + esc(r.travel_fee) + '원</option>'
    ).join('');
  }

  async function refresh() {
    try {
      if (panel === 'dashboard') return renderDashboard();
      if (panel === 'desk') return renderDesk();
      if (panel === 'board') return renderBoard('');
      if (panel === 'schedule') return renderSchedule();
      if (panel === 'customers') return renderCustomers();
      if (panel === 'equipment') return renderEquipment();
      if (panel === 'users') return renderUsers();
      if (panel === 'mall') return renderMall();
      if (panel === 'regions') return renderRegionsPanel();
      if (panel === 'settle') return renderSettle('unpaid');
      if (panel === 'reports') return renderReports('daily');
      if (panel === 'followup') return renderFollowup();
      if (panel === 'settings') return renderSettings();
    } catch (e) { toast(e.message, true); }
  }

  // ----- Dashboard -----
  async function renderDashboard() {
    const d = await api('/hq/dashboard');
    const cards = [
      ['today_calls','오늘 콜','desk'],
      ['today_visits','오늘 출장','schedule'],
      ['unassigned','미지정','board'],
      ['delayed','지연','board'],
      ['doc_incomplete','완료미제출','board'],
      ['photo_incomplete','사진미비','followup'],
      ['unpaid','미수','settle'],
      ['expense_pending','경비대기','settle'],
      ['today_done','오늘 완료','board'],
      ['repeats','재고장30일','board'],
      ['staff_load','직원부하','users']
    ];
    document.getElementById('dash').innerHTML = cards.map(([k,l,go]) =>
      '<div class="stat" data-go="' + go + '"><div class="v">' + esc(d[k] != null ? d[k] : 0) +
      '</div><div class="l">' + l + '</div></div>'
    ).join('');
    document.querySelectorAll('#dash .stat').forEach((el) => {
      el.onclick = () => {
        if (el.dataset.go === 'board' && el.querySelector('.l').textContent.indexOf('미지정') >= 0)
          showPanel('board'), renderBoard('waiting_assign');
        else showPanel(el.dataset.go);
      };
    });
    document.getElementById('dashExtra').innerHTML =
      '<div class="actions">' +
      '<button class="btn btn-primary" type="button" id="goDesk">전화 데스크</button>' +
      '<button class="btn" type="button" id="goUnassigned">미지정 큐</button>' +
      '<button class="btn" type="button" id="goUnpaid">미수 목록</button></div>';
    document.getElementById('goDesk').onclick = () => showPanel('desk');
    document.getElementById('goUnassigned').onclick = () => { showPanel('board'); renderBoard('waiting_assign'); };
    document.getElementById('goUnpaid').onclick = () => { showPanel('settle'); renderSettle('unpaid'); };
  }

  // ----- Desk -----
  function renderDesk() {
    const el = document.getElementById('p-desk');
    el.innerHTML = `
      <div class="split">
        <div>
          <div class="card">
            <h3>1. 전화/상호 검색</h3>
            <div class="row">
              <div class="grow"><label>수신 번호</label><input id="deskPhone" placeholder="010-1234-5678" /></div>
              <button class="btn btn-primary" type="button" id="btnDeskSearch">검색</button>
            </div>
            <div id="deskHits" style="margin-top:10px"></div>
          </div>
          <div class="card">
            <h3>2. 신규 고객 (없을 때)</h3>
            <div class="row">
              <div><label>유형 *</label>
                <select id="cType"><option value="franchise">가맹</option><option value="direct">직영</option>
                <option value="shop" selected>일반매장</option><option value="other">개인/기타</option></select></div>
              <div class="grow"><label>표시명 *</label><input id="cName" /></div>
            </div>
            <div class="row" style="margin-top:8px">
              <div class="grow"><label>대표전화 *</label><input id="cPhone" /></div>
              <div class="grow"><label>주소 *</label><input id="cAddr" /></div>
            </div>
            <div class="row" style="margin-top:8px">
              <div class="grow"><label>현장담당</label><input id="cContact" /></div>
              <div class="grow"><label>권역</label><select id="cRegion"></select></div>
            </div>
            <div class="actions">
              <button class="btn btn-primary" type="button" id="btnCustSave">고객 저장</button>
            </div>
          </div>
          <div class="card" id="eqCard" style="display:none">
            <h3>3. 장비</h3>
            <div id="eqList"></div>
            <div class="row" style="margin-top:8px">
              <div class="grow"><label>장비명 *</label><input id="eqName" /></div>
              <div class="grow"><label>설치위치 *</label><input id="eqLoc" placeholder="베이1" /></div>
            </div>
            <div class="row" style="margin-top:8px">
              <div class="grow"><label>모델</label><input id="eqModel" /></div>
              <div class="grow"><label>시리얼</label><input id="eqSerial" /></div>
            </div>
            <div class="actions"><button class="btn btn-primary" type="button" id="btnEqSave">장비 추가</button></div>
          </div>
        </div>
        <div>
          <div class="card" id="ticketCard" style="display:none">
            <h3>4. 출장 / 상담</h3>
            <div class="muted mono" id="selInfo" style="margin-bottom:8px"></div>
            <label>장비 *</label><select id="tEq"></select>
            <div style="margin-top:8px"><label>증상 *</label><textarea id="tSymptom"></textarea></div>
            <div class="row" style="margin-top:8px">
              <div class="grow"><label>권역</label><select id="tRegion"></select></div>
              <div class="grow"><label>주담당</label><select id="tAssignee"></select></div>
            </div>
            <div class="row" style="margin-top:8px">
              <div class="grow"><label>희망 방문</label><input id="tPref" type="datetime-local" /></div>
              <div class="grow"><label>긴급도</label>
                <select id="tUrg"><option value="normal">일반</option><option value="urgent">긴급</option></select></div>
            </div>
            <div style="margin-top:8px"><label>상담 로그 *</label><textarea id="tCallMemo" placeholder="통화 내용"></textarea></div>
            <div class="actions">
              <button class="btn btn-primary" type="button" id="btnDispatch">출장 만들기</button>
              <button class="btn" type="button" id="btnConsultEnd">상담종결</button>
            </div>
          </div>
        </div>
      </div>`;
    Promise.all([loadStaff(), loadRegions()]).then(() => {
      document.getElementById('cRegion').innerHTML = regionOptions();
      document.getElementById('tRegion').innerHTML = regionOptions();
      document.getElementById('tAssignee').innerHTML = staffOptions();
    });
    document.getElementById('btnDeskSearch').onclick = deskSearch;
    document.getElementById('btnCustSave').onclick = saveCustomer;
    document.getElementById('btnEqSave').onclick = saveEquipment;
    document.getElementById('btnDispatch').onclick = () => createDispatch('dispatch');
    document.getElementById('btnConsultEnd').onclick = () => createDispatch('consult');
    document.getElementById('deskPhone').onkeydown = (e) => { if (e.key === 'Enter') deskSearch(); };
  }

  async function deskSearch() {
    const phone = document.getElementById('deskPhone').value.trim();
    if (!phone) return toast('번호 입력', true);
    document.getElementById('cPhone').value = phone;
    document.getElementById('callPhone') && (document.getElementById('callPhone').value = phone);
    const rows = await api('/hq/customers?phone=' + encodeURIComponent(phone));
    const box = document.getElementById('deskHits');
    if (!rows.length) {
      box.innerHTML = '<div class="empty">고객 없음 → 왼쪽에서 신규 저장</div>';
      selectedCustomer = null;
      document.getElementById('eqCard').style.display = 'none';
      document.getElementById('ticketCard').style.display = 'none';
      return;
    }
    box.innerHTML = rows.map((c) =>
      '<div class="card" style="padding:10px;cursor:pointer" data-id="' + esc(c.customer_id) + '">' +
      '<b>' + esc(c.display_name) + '</b> <span class="mono">' + esc(c.primary_phone) + '</span><div class="muted">' +
      esc(c.address || '') + '</div></div>'
    ).join('');
    box.querySelectorAll('[data-id]').forEach((el) => {
      el.onclick = () => selectCustomer(rows.find((r) => r.customer_id === el.dataset.id));
    });
    if (rows.length === 1) selectCustomer(rows[0]);
  }

  async function selectCustomer(c) {
    selectedCustomer = c;
    document.getElementById('selInfo').textContent = c.display_name + ' / ' + c.primary_phone;
    document.getElementById('eqCard').style.display = 'block';
    document.getElementById('ticketCard').style.display = 'block';
    document.getElementById('tCallMemo').value = '';
    await refreshEquipment();
  }

  async function refreshEquipment() {
    if (!selectedCustomer) return;
    const eqs = await api('/hq/equipment?customer_id=' + encodeURIComponent(selectedCustomer.customer_id));
    document.getElementById('eqList').innerHTML = eqs.length
      ? '<table><thead><tr><th>장비</th><th>위치</th><th>시리얼</th></tr></thead><tbody>' +
        eqs.map((e) => '<tr><td>' + esc(e.name) + '</td><td>' + esc(e.location_note) + '</td><td class="mono">' +
          esc(e.serial) + '</td></tr>').join('') + '</tbody></table>'
      : '<div class="empty">장비 없음 — 아래에서 추가</div>';
    document.getElementById('tEq').innerHTML = eqs.length
      ? eqs.map((e) => '<option value="' + esc(e.equipment_id) + '">' + esc(e.name) + ' / ' + esc(e.location_note || e.serial || '') + '</option>').join('')
      : '<option value="">장비 없음</option>';
  }

  async function saveCustomer() {
    const body = {
      type: document.getElementById('cType').value,
      display_name: document.getElementById('cName').value.trim(),
      primary_phone: document.getElementById('cPhone').value.trim(),
      address: document.getElementById('cAddr').value.trim(),
      contact_name: document.getElementById('cContact').value.trim(),

  async function createDispatch(kind) {
    if (!selectedCustomer) return toast('고객 선택 필요', true);
    const equipment_id = document.getElementById('tEq').value;
    const symptom = document.getElementById('tSymptom').value.trim();
    const callMemo = document.getElementById('tCallMemo').value.trim();
    if (!equipment_id) return toast('장비 필수 — 먼저 추가', true);
    if (!symptom) return toast('증상 필수', true);
    if (!callMemo) return toast('상담 로그 필수', true);
    const region_id = document.getElementById('tRegion').value;
    const assignee_id = document.getElementById('tAssignee').value;
    const preferred = document.getElementById('tPref').value;
    try {
      await api('/hq/calls', {
        method: 'POST',
        body: JSON.stringify({
          phone: selectedCustomer.primary_phone,
          call_type: kind === 'consult' ? 'other' : 'as',
          memo: callMemo,
          customer_id: selectedCustomer.customer_id
        })
      });
      if (kind === 'consult') {
        toast('상담 로그 저장(상담종결)');
        return;
      }
      const t = await api('/hq/tickets', {
        method: 'POST',
        body: JSON.stringify({
          customer_id: selectedCustomer.customer_id,
          equipment_id, symptom,
          fault_type: '',
          urgency: document.getElementById('tUrg').value,
          assignee_id, region_id,
          ticket_type: 'dispatch',
          preferred_at: preferred ? new Date(preferred).toISOString() : '',
          intake_phone: selectedCustomer.primary_phone,
          intake_memo: callMemo,
          bill_type: 'unknown'
        })
      });
      if (region_id) {
        await api('/hq/tickets/' + t.ticket_id + '/finance', {
          method: 'POST', body: JSON.stringify({ region_id, ticket_type: 'dispatch' })
        });
      }

      openTicket(t.ticket_id);

          '<a class="btn btn-primary" id="mPdf" download="' + esc(doc.number) + '.pdf">PDF</a>' +
          '<a class="btn btn-primary" id="mPng" download="' + esc(doc.number) + '.png">PNG</a></div>');
        document.getElementById('mClose').onclick = closeModal;
        function b64ToBlob(b64, type) {
          const bin = atob(b64 || '');
          const arr = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          return new Blob([arr], { type: type });
        }
        document.getElementById('mPdf').href = URL.createObjectURL(b64ToBlob(dl.pdf_base64, 'application/pdf'));
        document.getElementById('mPng').href = URL.createObjectURL(b64ToBlob(dl.image_png_base64, 'image/png'));
      } catch (e) { toast(e.message, true); }

  async function loadSch() {
    const sid = document.getElementById('schStaff').value;
    const day = document.getElementById('schDate').value;
    const data = await api('/hq/schedule?date=' + encodeURIComponent(day));
    const mine = (data.tickets || []).filter((t) => !sid || t.assignee_id === sid);
    const conflicts = (data.conflicts || []).filter((c) => !sid || c.assignee_id === sid);
    let html = '';
    if (conflicts.length) html += '<div class="empty" style="color:#ff8a95;margin-bottom:8px">충돌 경고 ' + conflicts.length + '건 (저장은 됨)</div>';
    html += mine.length
      ? '<table><thead><tr><th>시각</th><th>번호</th><th>상태</th></tr></thead><tbody>' +
        mine.map((t) => '<tr class="clickable" data-id="' + esc(t.ticket_id) + '"><td class="mono">' + esc(t.scheduled_at) +
          '</td><td class="mono">' + esc(t.number) + '</td><td>' + badge(t.status) + '</td></tr>').join('') + '</tbody></table>'
      : '<div class="empty">일정 없음</div>';
    document.getElementById('schList').innerHTML = html;
    document.querySelectorAll('#schList tr.clickable').forEach((tr) => tr.onclick = () => openTicket(tr.dataset.id));

    const all = await api('/hq/tickets');
    const pool = all.filter((t) => t.status !== 'closed' && t.status !== 'cancelled' && (!t.scheduled_at || t.assignee_id !== sid));
    document.getElementById('schPool').innerHTML = pool.length
      ? '<table><thead><tr><th>번호</th><th>상태</th><th>증상</th><th>부여</th></tr></thead><tbody>' +
        pool.slice(0, 30).map((t) => '<tr><td class="mono">' + esc(t.number) + '</td><td>' + badge(t.status) +
          '</td><td>' + esc(t.symptom) + '</td><td><button class="btn btn-sm btn-primary" type="button" data-give="' +
          esc(t.ticket_id) + '">이 직원에게</button></td></tr>').join('') + '</tbody></table>'
      : '<div class="empty">부여할 티켓 없음</div>';
    document.querySelectorAll('[data-give]').forEach((b) => b.onclick = async () => {
      if (!sid) return toast('직원 먼저 선택', true);
      const when = prompt('방문일시 (YYYY-MM-DDTHH:mm)', day + 'T10:00');
      if (!when) return;
      try {
        await api('/hq/tickets/' + b.dataset.give + '/assign', { method: 'POST', body: JSON.stringify({ assignee_id: sid }) });
        const r = await api('/hq/tickets/' + b.dataset.give + '/schedule', { method: 'POST', body: JSON.stringify({ scheduled_at: new Date(when).toISOString() }) });
        toast(r.conflict_warning ? '부여됨 (충돌 경고)' : '부여됨');
        loadSch();
      } catch (e) { toast(e.message, true); }
    });
  }

    );
    document.getElementById('hubClose').onclick = closeModal;
    document.getElementById('hubSave').onclick = async () => {
      try {
        await api('/hq/customers/' + id + '/phone', { method: 'POST', body: JSON.stringify({ primary_phone: document.getElementById('hubPhone').value.trim() }) });
        toast('전화 변경'); closeModal(); refresh();
      } catch (e) { toast(e.message, true); }
    };
    document.getElementById('hubDesk').onclick = () => {
      closeModal(); showPanel('desk');
      setTimeout(async () => {
        document.getElementById('deskPhone').value = c.primary_phone;
        await deskSearch();
      }, 50);
    };
    // purchase confirm
    const buyBtn = document.createElement('button');
    buyBtn.className = 'btn btn-primary';
    buyBtn.type = 'button';
    buyBtn.textContent = '구매확정';
    buyBtn.onclick = async () => {
      const products = await api('/hq/products');
      if (!products.length) return toast('먼저 사내몰 상품 등록', true);
      showModal('<h3>구매확정</h3><label>상품</label><select id="bp">' +
        products.map((p) => '<option value="' + esc(p.product_id) + '">' + esc(p.name) + '</option>').join('') +
        '</select><label style="margin-top:8px">유형</label><select id="bf"><option value="ship">발송</option><option value="install">설치</option></select>' +
        '<label style="margin-top:8px">확정일</label><input id="bd" type="date" value="' + new Date().toISOString().slice(0,10) + '" />' +
        '<div class="actions"><button class="btn" type="button" id="bx">취소</button><button class="btn btn-primary" type="button" id="bs">저장</button></div>');
      document.getElementById('bx').onclick = closeModal;
      document.getElementById('bs').onclick = async () => {
        await api('/hq/purchases', { method: 'POST', body: JSON.stringify({
          customer_id: id,
          product_id: document.getElementById('bp').value,
          fulfill_type: document.getElementById('bf').value,
          confirm_date: document.getElementById('bd').value
        })});
        toast('구매확정 저장'); closeModal();
      };
    };
    document.querySelector('#modalBody .actions').appendChild(buyBtn);
  }

  async function renderEquipment() {
    const el = document.getElementById('p-equipment');
    el.innerHTML = `<div class="card"><div class="row"><div class="grow"><label>고객ID</label>
      <input id="eqCid" placeholder="비우면 전체" /></div>
      <button class="btn btn-primary" type="button" id="eqBtn">검색</button></div><div id="eqAll" style="margin-top:10px"></div></div>`;
    const run = async () => {
      const cid = document.getElementById('eqCid').value.trim();
      const rows = await api('/hq/equipment' + (cid ? ('?customer_id=' + encodeURIComponent(cid)) : ''));
      document.getElementById('eqAll').innerHTML = rows.length
        ? '<table><thead><tr><th>장비</th><th>고객</th><th>위치</th><th>시리얼</th></tr></thead><tbody>' +
          rows.map((e) => '<tr><td>' + esc(e.name) + '</td><td class="mono">' + esc(e.customer_id) + '</td><td>' +
            esc(e.location_note) + '</td><td class="mono">' + esc(e.serial) + '</td></tr>').join('') + '</tbody></table>'
        : '<div class="empty">없음</div>';
    };
    document.getElementById('eqBtn').onclick = run;
    await run();
  }

  async function renderUsers() {
    const rows = await api('/hq/users');
    const el = document.getElementById('p-users');
    el.innerHTML = `<div class="card"><div class="actions" style="justify-content:space-between">
      <h3>직원</h3><button class="btn btn-primary" type="button" id="uAdd">＋ 직원 등록</button></div>
      <div id="uList"></div></div>`;
    document.getElementById('uList').innerHTML =
      '<table><thead><tr><th>이름</th><th>로그인</th><th>역할</th><th>재직</th><th></th></tr></thead><tbody>' +
      rows.map((u) => '<tr><td>' + esc(u.name) + '</td><td class="mono">' + esc(u.login) + '</td><td>' + esc(u.role) +
        '</td><td>' + esc(u.employment_status) + '</td><td>' +
        (u.employment_status === 'active'
          ? '<button class="btn btn-sm" type="button" data-leave="' + esc(u.user_id) + '">휴직</button> ' +
            '<button class="btn btn-sm btn-danger" type="button" data-out="' + esc(u.user_id) + '">퇴사</button>'
          : '') + '</td></tr>').join('') + '</tbody></table>';
    document.getElementById('uAdd').onclick = () => {
      showModal(`<h3>직원 등록</h3>
        <label>로그인</label><input id="nuLogin" />
        <label style="margin-top:8px">이름</label><input id="nuName" />
        <label style="margin-top:8px">역할</label>
        <select id="nuRole"><option value="technician">기사</option><option value="dispatcher">배차</option>
        <option value="counselor">상담</option><option value="admin">관리자</option></select>
        <label style="margin-top:8px">비밀번호</label><input id="nuPass" value="tech123" />
        <div class="actions"><button class="btn" type="button" id="nuCancel">취소</button>
        <button class="btn btn-primary" type="button" id="nuSave">저장</button></div>`);
      document.getElementById('nuCancel').onclick = closeModal;
      document.getElementById('nuSave').onclick = async () => {
        try {
          await api('/hq/users', { method: 'POST', body: JSON.stringify({
            login: document.getElementById('nuLogin').value.trim(),
            name: document.getElementById('nuName').value.trim(),
            role: document.getElementById('nuRole').value,
            password: document.getElementById('nuPass').value
          })});
          toast('직원 등록'); closeModal(); renderUsers();
        } catch (e) { toast(e.message, true); }
      };
    };
    document.querySelectorAll('[data-leave]').forEach((b) => b.onclick = async () => {
      await api('/hq/users/' + b.dataset.leave, { method: 'PUT', body: JSON.stringify({ employment_status: 'leave' }) });
      toast('휴직 처리'); renderUsers();
    });
    document.querySelectorAll('[data-out]').forEach((b) => b.onclick = async () => {
      await api('/hq/users/' + b.dataset.out, { method: 'PUT', body: JSON.stringify({ employment_status: 'resigned' }) });
      toast('퇴사 처리'); renderUsers();
    });
  }

  // ----- Mall / Regions / Settle / Reports / Followup / Settings -----
  async function renderMall() {
    const rows = await api('/hq/products');
    const el = document.getElementById('p-mall');
    el.innerHTML = `<div class="card"><div class="actions" style="justify-content:space-between"><h3>사내몰</h3>
      <button class="btn btn-primary" type="button" id="pAdd">＋ 상품</button></div><div id="pList"></div></div>`;
    document.getElementById('pList').innerHTML = rows.length
      ? '<table><thead><tr><th>이름</th><th>카테고리</th><th>판매가</th><th>원가</th><th>SKU</th></tr></thead><tbody>' +
        rows.map((p) => '<tr><td>' + esc(p.name) + '</td><td>' + esc(p.category) + '</td><td class="mono">' + esc(p.sale_price) +
          '</td><td class="mono">' + esc(p.cost_price) + '</td><td class="mono">' + esc(p.sku) + '</td></tr>').join('') + '</tbody></table>'
      : '<div class="empty">상품 없음</div>';
    document.getElementById('pAdd').onclick = () => {
      showModal(`<h3>상품 등록</h3>
        <label>이름</label><input id="pn" />
        <label style="margin-top:8px">카테고리</label><input id="pc" value="부품" />
        <label style="margin-top:8px">판매단가</label><input id="pp" type="number" value="10000" />
        <label style="margin-top:8px">원가</label><input id="pco" type="number" value="0" />
        <label style="margin-top:8px">SKU</label><input id="ps" />
        <div class="actions"><button class="btn" type="button" id="pcancel">취소</button>
        <button class="btn btn-primary" type="button" id="psave">저장</button></div>`);
      document.getElementById('pcancel').onclick = closeModal;
      document.getElementById('psave').onclick = async () => {
        try {
          await api('/hq/products', { method: 'POST', body: JSON.stringify({
            name: document.getElementById('pn').value.trim(),
            category: document.getElementById('pc').value.trim(),
            sale_price: Number(document.getElementById('pp').value || 0),
            cost_price: Number(document.getElementById('pco').value || 0),
            sku: document.getElementById('ps').value.trim()
          })});
          toast('상품 저장'); closeModal(); renderMall();
        } catch (e) { toast(e.message, true); }
      };
    };
  }

  async function renderRegionsPanel() {
    const rows = await api('/hq/regions');
    const el = document.getElementById('p-regions');
    el.innerHTML = `<div class="card"><div class="actions" style="justify-content:space-between"><h3>권역 요금표</h3>
      <button class="btn btn-primary" type="button" id="rAdd">＋ 권역</button></div><div id="rList"></div></div>`;
    document.getElementById('rList').innerHTML =
      '<table><thead><tr><th>이름</th><th>광역</th><th>출장비</th><th>상태</th></tr></thead><tbody>' +
      rows.map((r) => '<tr><td>' + esc(r.name) + '</td><td>' + esc(r.metro) + '</td><td class="mono">' + esc(r.travel_fee) +
        '</td><td>' + esc(r.status) + '</td></tr>').join('') + '</tbody></table>';
    document.getElementById('rAdd').onclick = () => {
      showModal(`<h3>권역 추가/수정</h3>
        <label>이름</label><input id="rn" placeholder="서울-송파" />
        <label style="margin-top:8px">광역</label><input id="rm" placeholder="서울" />
        <label style="margin-top:8px">출장비</label><input id="rf" type="number" value="30000" />
        <div class="actions"><button class="btn" type="button" id="rc">취소</button>
        <button class="btn btn-primary" type="button" id="rs">저장</button></div>`);
      document.getElementById('rc').onclick = closeModal;
      document.getElementById('rs').onclick = async () => {
        try {
          await api('/hq/regions', { method: 'POST', body: JSON.stringify({
            name: document.getElementById('rn').value.trim(),
            metro: document.getElementById('rm').value.trim(),
            travel_fee: Number(document.getElementById('rf').value || 0)
          })});
          toast('권역 저장'); closeModal(); renderRegionsPanel();
        } catch (e) { toast(e.message, true); }
      };
    };
  }

  async function renderSettle(tab) {
    const el = document.getElementById('p-settle');
    el.innerHTML = `<div class="card"><div class="actions">
      <button class="btn btn-sm" type="button" data-t="unpaid">미수</button>
      <button class="btn btn-sm" type="button" data-t="expenses">경비</button>
      <button class="btn btn-sm" type="button" data-t="payroll">급여</button>
      <button class="btn btn-sm btn-primary" type="button" id="sExp">경비 신청</button>
      <button class="btn btn-sm btn-primary" type="button" id="sPay">급여 입력</button>
      </div><div id="sBody" style="margin-top:12px"></div></div>`;
    el.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => renderSettle(b.dataset.t));
    document.getElementById('sExp').onclick = () => {
      showModal(`<h3>경비 신청</h3><label>금액</label><input id="ea" type="number" />
        <label style="margin-top:8px">항목</label><input id="ec" value="유류" />
        <label style="margin-top:8px">메모</label><input id="em" />
        <div class="actions"><button class="btn" type="button" id="ex">취소</button>
        <button class="btn btn-primary" type="button" id="es">저장</button></div>`);
      document.getElementById('ex').onclick = closeModal;
      document.getElementById('es').onclick = async () => {
        await api('/hq/expenses', { method: 'POST', body: JSON.stringify({
          amount: Number(document.getElementById('ea').value || 0),
          category: document.getElementById('ec').value, memo: document.getElementById('em').value
        })});
        toast('경비 신청'); closeModal(); renderSettle('expenses');
      };
    };
    document.getElementById('sPay').onclick = async () => {
      await loadStaff();
      showModal(`<h3>급여 입력</h3><label>직원</label><select id="pu">${staffOptions()}</select>
        <label style="margin-top:8px">월</label><input id="pym" value="${new Date().toISOString().slice(0,7)}" />
        <label style="margin-top:8px">기본급</label><input id="pb" type="number" value="3000000" />
        <label style="margin-top:8px">수당</label><input id="pa" type="number" value="0" />
        <label style="margin-top:8px">공제</label><input id="pd" type="number" value="0" />
        <div class="actions"><button class="btn" type="button" id="px">취소</button>
        <button class="btn btn-primary" type="button" id="ps">저장</button></div>`);
      document.getElementById('px').onclick = closeModal;
      document.getElementById('ps').onclick = async () => {
        await api('/hq/payroll', { method: 'POST', body: JSON.stringify({
          user_id: document.getElementById('pu').value,
          year_month: document.getElementById('pym').value,
          base_pay: Number(document.getElementById('pb').value || 0),
          allowances: Number(document.getElementById('pa').value || 0),
          deductions: Number(document.getElementById('pd').value || 0)
        })});
        toast('급여 저장'); closeModal(); renderSettle('payroll');
      };
    };
    const body = document.getElementById('sBody');
    if (tab === 'expenses') {
      const rows = await api('/hq/expenses');
      body.innerHTML = '<table><thead><tr><th>금액</th><th>항목</th><th>상태</th><th></th></tr></thead><tbody>' +
        rows.map((e) => '<tr><td>' + esc(e.amount) + '</td><td>' + esc(e.category) + '</td><td>' + esc(e.status) +
          '</td><td>' + (e.status === 'pending' ? '<button class="btn btn-sm" type="button" data-ap="' + esc(e.expense_id) + '">승인</button>' : '') +
          '</td></tr>').join('') + '</tbody></table>';
      body.querySelectorAll('[data-ap]').forEach((b) => b.onclick = async () => {
        await api('/hq/expenses/' + b.dataset.ap + '/decide', { method: 'POST', body: JSON.stringify({ status: 'approved' }) });
        toast('승인'); renderSettle('expenses');
      });
    } else if (tab === 'payroll') {
      const rows = await api('/hq/payroll');
      body.innerHTML = '<table><thead><tr><th>월</th><th>직원</th><th>기본</th><th>수당</th><th>공제</th><th>총액</th></tr></thead><tbody>' +
        rows.map((p) => '<tr><td>' + esc(p.year_month) + '</td><td class="mono">' + esc(p.user_id) + '</td><td>' +
          esc(p.base_pay) + '</td><td>' + esc(p.allowances) + '</td><td>' + esc(p.deductions) + '</td><td><b>' +
          esc(p.total) + '</b></td></tr>').join('') + '</tbody></table>';
    } else {
      const rows = await api('/hq/unpaid');
      body.innerHTML = rows.length
        ? '<table><thead><tr><th>티켓</th><th>정산</th><th>출장비</th><th>수금</th><th></th></tr></thead><tbody>' +
          rows.map((r) => '<tr><td class="mono">' + esc(r.ticket_id) + '</td><td>' + esc(r.settlement_status) +
            '</td><td>' + esc(r.travel_fee) + '</td><td>' + esc(r.settlement_paid) +
            '</td><td><button class="btn btn-sm" type="button" data-t="' + esc(r.ticket_id) + '">열기</button></td></tr>').join('') +
          '</tbody></table>'
        : '<div class="empty">미수 없음</div>';
      body.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => openTicket(b.dataset.t));
    }
  }

  async function renderReports(kind) {
    const el = document.getElementById('p-reports');
    el.innerHTML = `<div class="card"><div class="actions">
      <button class="btn btn-sm" type="button" data-k="daily">일</button>
      <button class="btn btn-sm" type="button" data-k="weekly">주</button>
      <button class="btn btn-sm" type="button" data-k="monthly">월</button>
      <a class="btn btn-primary btn-sm" id="rDl" download="report.csv">CSV 다운로드</a></div>
      <pre id="rOut" class="mono" style="margin-top:12px;white-space:pre-wrap;font-size:12px"></pre></div>`;
    const load = async (k) => {
      const d = await api('/hq/reports?kind=' + encodeURIComponent(k));
      document.getElementById('rOut').textContent = d.csv || '';
      const blob = new Blob([d.csv || ''], { type: 'text/csv;charset=utf-8' });
      document.getElementById('rDl').href = URL.createObjectURL(blob);
      document.getElementById('rDl').download = 'report-' + k + '.csv';
    };
    el.querySelectorAll('[data-k]').forEach((b) => b.onclick = () => load(b.dataset.k));
    await load(kind || 'daily');
  }

  async function renderFollowup() {
    const rows = await api('/hq/followups');
    const el = document.getElementById('p-followup');
    el.innerHTML = '<div class="card"><h3>사후함</h3><div id="fList"></div></div>';
    document.getElementById('fList').innerHTML = rows.length
      ? '<table><thead><tr><th>번호</th><th>상태</th><th>사진미비</th><th></th></tr></thead><tbody>' +
        rows.map((t) => '<tr><td class="mono">' + esc(t.number) + '</td><td>' + badge(t.status) + '</td><td>' +
          esc(t.photo_incomplete) + '</td><td><button class="btn btn-sm" type="button" data-id="' + esc(t.ticket_id) +
          '">열기</button></td></tr>').join('') + '</tbody></table>'
      : '<div class="empty">없음</div>';
    document.querySelectorAll('#fList [data-id]').forEach((b) => b.onclick = () => openTicket(b.dataset.id));
  }

  async function renderSettings() {
    const s = await api('/hq/settings');
    document.getElementById('p-settings').innerHTML =
      '<div class="card"><h3>설정 (1차 잠금값)</h3><table><tbody>' +
      Object.keys(s).map((k) => '<tr><td class="mono">' + esc(k) + '</td><td>' + esc(s[k]) + '</td></tr>').join('') +
      '</tbody></table></div>';
  }

  // boot
  showPanel('dashboard');
})();
</script>
