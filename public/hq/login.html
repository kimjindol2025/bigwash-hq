<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>빅워시 HQ - 로그인</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: #101827;
      --line: #3d4f6e;
      --text: #f3f7ff;
      --muted: #c5d4ea;
      --accent: #3de0c7;
      --danger: #ff8a95;
      --input: #0b1220;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Noto Sans KR", sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      color: var(--text);
      background:
        radial-gradient(900px 420px at 15% 10%, rgba(61, 224, 199, 0.14), transparent 55%),
        radial-gradient(700px 360px at 90% 85%, rgba(91, 140, 255, 0.14), transparent 50%),
        var(--bg);
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      background: rgba(18, 26, 43, 0.92);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 36px 32px 28px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo .mark {
      width: 42px; height: 42px; margin: 0 auto 14px; border-radius: 12px;
      display: grid; place-items: center;
      background: rgba(61, 224, 199, 0.12);
      border: 1px solid rgba(61, 224, 199, 0.35);
      color: var(--accent); font-weight: 800; font-family: var(--mono); font-size: 14px;
    }
    .logo h1 { font-size: 24px; letter-spacing: 0.02em; margin-bottom: 8px; }
    .logo p { color: var(--muted); font-size: 13px; font-family: var(--mono); }
    .form-group { margin-bottom: 16px; }
    label {
      display: block; margin-bottom: 8px; color: var(--muted);
      font-weight: 600; font-size: 12px; letter-spacing: 0.04em;
    }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 12px 14px; border: 1px solid var(--line);
      border-radius: 10px; font-size: 16px; background: var(--input); color: var(--text); min-height: 44px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input::placeholder { color: #9db0c9; }
    input:focus {
      outline: none; border-color: rgba(61, 224, 199, 0.55);
      box-shadow: 0 0 0 3px rgba(61, 224, 199, 0.12);
    }
    button {
      width: 100%; padding: 12px; margin-top: 10px;
      background: linear-gradient(135deg, #2bd4bd, #2a9df4);
      color: #041018; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 800; cursor: pointer;
      transition: filter 0.15s, transform 0.15s;
    }
    button:hover { filter: brightness(1.06); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .error {
      padding: 12px; background: rgba(255, 107, 122, 0.12); color: #ff8a95;
      border: 1px solid rgba(255, 107, 122, 0.35); border-radius: 10px;
      margin-bottom: 16px; font-size: 13px; display: none;
    }
    .error.show { display: block; }
    .loading {
      display: none; text-align: center; color: var(--accent);
      font-family: var(--mono); font-size: 12px; margin-bottom: 8px;
    }
    .hint {
      margin-top: 18px; padding: 12px; border-radius: 10px;
      border: 1px dashed var(--line); background: rgba(61, 224, 199, 0.06);
      color: var(--muted); font-size: 12px; font-family: var(--mono); line-height: 1.6;
    }
    .hint strong { color: var(--accent); }
    .footer {
      text-align: center; margin-top: 24px; color: var(--muted);
      font-size: 11px; font-family: var(--mono); line-height: 1.6;
    }
    @media (max-width: 979px) {
      body { align-items: flex-start; min-height: 100dvh; padding: 24px; overflow: auto; }
      .login-container { padding: 28px 20px 24px; }
      input[type="text"], input[type="password"], button { min-height: 44px; font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <div class="mark">HQ</div>
      <h1>빅워시 HQ</h1>
      <p>본사 CRM · AS 콘솔</p>
    </div>

    <div class="error" id="errorMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="login">로그인 ID</label>
        <input type="text" id="login" name="login" placeholder="admin" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <div class="loading" id="loading">인증 중…</div>
      <button type="submit" id="loginBtn">로그인</button>
    </form>

    <div class="hint">계정은 서버 시드·환경변수로만 안내합니다. 문서에 실비밀번호를 적지 마세요.</div>
    <div class="footer">bigwash-as · hq console</div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loading = document.getElementById('loading');
    const loginBtn = document.getElementById('loginBtn');

    if (localStorage.getItem('hq_token')) {
      window.location.href = '/hq/app.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const login = document.getElementById('login').value.trim();
      const password = document.getElementById('password').value;

      errorMsg.classList.remove('show');
      loading.style.display = 'block';
      loginBtn.disabled = true;

      try {
        const response = await fetch('/hq/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login, password })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '로그인 실패');

        localStorage.setItem('hq_token', data.token);
        localStorage.setItem('hq_user', JSON.stringify(data.user || {}));
        window.location.href = '/hq/app.html';
      } catch (err) {
        errorMsg.textContent = err.message || '로그인 실패';
        errorMsg.classList.add('show');
      } finally {
        loading.style.display = 'none';
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
